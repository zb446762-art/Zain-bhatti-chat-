
<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080808">
<title>Zain Bhatti Chat</title>

<style>
:root {
  --black:#080808;
  --panel:#121212;
  --panel2:#1b1b1b;
  --gold:#d4af37;
  --gold2:#f4d675;
  --white:#f5f5f5;
  --muted:#999;
  --border:#34302a;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--black);color:var(--white);
  font-family:Arial,sans-serif;
}
button,input{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.gold{color:var(--gold)}
.auth{
  min-height:100vh;display:flex;align-items:center;
  justify-content:center;padding:20px;
  background:radial-gradient(ellipse at top,#30250b,#080808 65%);
}
.auth-card{
  width:100%;max-width:390px;background:var(--panel);
  padding:28px;border:1px solid #6d5720;border-radius:18px;
  box-shadow:0 10px 45px #000;
}
.logo{text-align:center;color:var(--gold);font-size:27px;
font-weight:bold;margin-bottom:8px}
.subtitle{text-align:center;color:var(--muted);margin-bottom:25px}
input{
  width:100%;padding:14px;margin:7px 0;
  color:white;background:#080808;border:1px solid var(--border);
  border-radius:9px;outline:none;
}
input:focus{border-color:var(--gold)}
.gold-btn{
  width:100%;padding:13px;background:var(--gold);
  color:#080808;border:0;border-radius:9px;
  font-weight:bold;margin-top:10px;
}
.gold-btn:hover{background:var(--gold2)}
.link-btn{
  background:none;border:0;color:var(--gold);
  padding:12px 0;width:100%;
}
.error{color:#ff7777;font-size:13px;white-space:pre-wrap}
.app{height:100dvh;display:flex;flex-direction:column}
header{
  height:65px;flex-shrink:0;background:#111;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 17px;
}
.brand{color:var(--gold);font-size:19px;font-weight:bold}
.header-right{display:flex;align-items:center;gap:12px}
.user-small{font-size:12px;color:var(--muted)}
.menu-wrap{position:relative}
.menu-btn{
  background:none;color:var(--gold);border:1px solid #6d5720;
  border-radius:8px;font-size:23px;width:40px;height:40px;
}
.menu{
  position:absolute;right:0;top:47px;width:190px;
  background:#1b1b1b;border:1px solid #6d5720;
  border-radius:10px;padding:7px;z-index:10;
  box-shadow:0 8px 25px #000;
}
.menu button{
  display:block;width:100%;text-align:left;padding:12px;
  color:white;background:none;border:0;border-radius:6px;
}
.menu button:hover{background:#30250b;color:var(--gold)}
.main{display:flex;flex:1;min-height:0}
.sidebar{
  width:320px;flex-shrink:0;background:#101010;
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;
}
.side-title{padding:17px;color:var(--gold);font-weight:bold}
.search{padding:0 12px 12px}
.user-list{overflow-y:auto;flex:1}
.user-item{
  display:flex;align-items:center;gap:12px;
  padding:13px;border-bottom:1px solid #242424;
  cursor:pointer;
}
.user-item:hover,.user-item.active{background:#27200f}
.avatar{
  width:43px;height:43px;border-radius:50%;
  background:#30250b;color:var(--gold);
  border:1px solid #8c7027;
  display:flex;align-items:center;justify-content:center;
  font-weight:bold;flex-shrink:0;
}
.user-info{flex:1;min-width:0}
.user-name{font-weight:bold}
.user-status{font-size:12px;color:var(--muted);margin-top:5px}
.online{color:var(--gold)}
.chat{
  flex:1;min-width:0;display:flex;flex-direction:column;
  background:radial-gradient(ellipse at center,#17130b,#090909);
}
.chat-head{
  padding:13px 17px;background:#111;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:12px;
}
.chat-head-name{font-weight:bold}
.messages{
  flex:1;overflow-y:auto;padding:18px;
  display:flex;flex-direction:column;gap:12px;
}
.empty{
  margin:auto;text-align:center;color:var(--muted);
  line-height:2;padding:20px;
}
.bubble{
  max-width:min(75%,440px);padding:11px 14px;
  border-radius:13px;background:#242424;
  border:1px solid #39332a;align-self:flex-start;
  overflow-wrap:anywhere;
}
.bubble.mine{
  align-self:flex-end;background:#30250b;
  border-color:#80651f;
}
.msg-time{font-size:10px;color:#c3ad75;margin-top:6px;text-align:right}
.composer{
  display:flex;gap:9px;padding:12px;
  background:#111;border-top:1px solid var(--border);
}
.composer input{margin:0;flex:1;min-width:0}
.send-btn{
  width:53px;border:0;border-radius:9px;
  background:var(--gold);font-weight:bold;color:#080808;
}
.mobile-back{display:none;background:none;border:0;color:var(--gold);font-size:23px}
@media(max-width:650px){
  .sidebar{width:100%;border:0}
  .chat{display:none}
  .main.chat-open .sidebar{display:none}
  .main.chat-open .chat{display:flex}
  .mobile-back{display:block}
  .user-small{display:none}
}
</style>
</head>

<body>

<section id="authScreen" class="auth">
  <div class="auth-card">
    <div class="logo">✦ ZAIN BHATTI CHAT ✦</div>
    <div class="subtitle">آپ کی اپنی محفوظ چیٹنگ ایپ</div>

    <div id="signupFields">
      <input id="name" placeholder="آپ کا نام">
    </div>
    <input id="email" type="email" placeholder="ای میل ایڈریس">
    <input id="password" type="password" placeholder="پاس ورڈ">

    <button id="authButton" class="gold-btn">اکاؤنٹ بنائیں</button>
    <button id="switchAuth" class="link-btn">پہلے سے اکاؤنٹ ہے؟ لاگ اِن کریں</button>
    <div id="authError" class="error"></div>
  </div>
</section>

<section id="appScreen" class="app hidden">
  <header>
    <div class="brand">✦ ZAIN BHATTI CHAT</div>
    <div class="header-right">
      <span id="headerUser" class="user-small"></span>
      <div class="menu-wrap">
        <button id="menuButton" class="menu-btn">⋮</button>
        <div id="menu" class="menu hidden">
          <button id="profileButton">✦ پروفائل تبدیل کریں</button>
          <button id="refreshButton">↻ صارفین ریفریش کریں</button>
          <button id="logoutButton">⇥ لاگ آؤٹ</button>
        </div>
      </div>
    </div>
  </header>

  <div class="main" id="main">
    <aside class="sidebar">
      <div class="side-title">آپ کے رابطے</div>
      <div class="search">
        <input id="searchUsers" placeholder="نام یا ای میل تلاش کریں">
      </div>
      <div id="userList" class="user-list">
        <div class="empty">صارفین لوڈ ہو رہے ہیں...</div>
      </div>
    </aside>

    <section class="chat">
      <div class="chat-head">
        <button id="backButton" class="mobile-back">‹</button>
        <div class="avatar" id="chatAvatar">Z</div>
        <div>
          <div class="chat-head-name" id="chatName">چیٹ منتخب کریں</div>
          <div class="user-status" id="chatStatus">پیغام بھیجنے کے لیے صارف منتخب کریں</div>
        </div>
      </div>

      <div id="messages" class="messages">
        <div class="empty">
          <div class="gold">✦ ZAIN BHATTI CHAT ✦</div>
          اپنی گفتگو شروع کرنے کے لیے کسی صارف کو منتخب کریں۔
        </div>
      </div>

      <form id="messageForm" class="composer">
        <input id="messageInput" placeholder="اپنا پیغام لکھیں..." autocomplete="off" disabled>
        <button id="sendButton" class="send-btn" disabled>➤</button>
      </form>
    </section>
  </div>
</section>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
// آپ کے موجودہ Firebase پروجیکٹ کی معلومات
const firebaseConfig = {
  apiKey: "AIzaSyBBM8njxaNWZcib0HA3kPNmw32CMc0tqs",
  authDomain: "zain-bhatti-chat.firebaseapp.com",
  projectId: "zain-bhatti-chat",
  storageBucket: "zain-bhatti-chat.firebasestorage.app",
  messagingSenderId: "815632070562",
  appId: "1:815632070562:web:d28b401630fd4cf21064fb"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let currentUser = null;
let currentPeer = null;
let currentChatId = null;
let signupMode = true;
let usersCache = [];
let unsubscribeUsers = null;
let unsubscribeChats = null;
let unsubscribeMessages = null;

const $ = id => document.getElementById(id);

function showError(id, error) {
  $(id).textContent = error.message || String(error);
}

function safeText(value) {
  return String(value || "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[c]);
}

function initials(name) {
  return (name || "?").trim().charAt(0).toUpperCase();
}

function showApp() {
  $("authScreen").classList.add("hidden");
  $("appScreen").classList.remove("hidden");
}

function showAuth() {
  $("appScreen").classList.add("hidden");
  $("authScreen").classList.remove("hidden");
}

function updateAuthMode() {
  $("signupFields").classList.toggle("hidden", !signupMode);
  $("authButton").textContent = signupMode ? "اکاؤنٹ بنائیں" : "لاگ اِن کریں";
  $("switchAuth").textContent = signupMode
    ? "پہلے سے اکاؤنٹ ہے؟ لاگ اِن کریں"
    : "نیا اکاؤنٹ بنانا ہے؟ سائن اَپ کریں";
  $("authError").textContent = "";
}

$("switchAuth").onclick = () => {
  signupMode = !signupMode;
  updateAuthMode();
};

$("authButton").onclick = async () => {
  const email = $("email").value.trim();
  const password = $("password").value;
  const name = $("name").value.trim();

  $("authError").textContent = "";

  if (!email || !password || (signupMode && !name)) {
    $("authError").textContent = "تمام ضروری خانے پُر کریں۔";
    return;
  }

  $("authButton").disabled = true;

  try {
    if (signupMode) {
      const result = await auth.createUserWithEmailAndPassword(email, password);
      await db.collection("users").doc(result.user.uid).set({
        uid: result.user.uid,
        name: name,
        email: email,
        online: true,
        lastSeen: firebase.firestore.FieldValue.serverTimestamp(),
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    } else {
      await auth.signInWithEmailAndPassword(email, password);
    }
  } catch (error) {
    showError("authError", error);
  } finally {
    $("authButton").disabled = false;
  }
};

async function setPresence(online) {
  if (!currentUser) return;
  try {
    await db.collection("users").doc(currentUser.uid).set({
      online: online,
      lastSeen: firebase.firestore.FieldValue.serverTimestamp()
    }, {merge:true});
  } catch (error) {
    console.error("Presence error:", error);
  }
}

function startUsers() {
  if (unsubscribeUsers) unsubscribeUsers();

  unsubscribeUsers = db.collection("users").onSnapshot(snapshot => {
    usersCache = snapshot.docs
      .map(doc => ({...doc.data(), uid:doc.id}))
      .filter(user => user.uid !== currentUser.uid);
    renderUsers();
    if (currentPeer) {
      const updated = usersCache.find(u => u.uid === currentPeer.uid);
      if (updated) {
        currentPeer = updated;
        $("chatStatus").textContent = updated.online ? "آن لائن" : "آف لائن";
      }
    }
  }, error => {
    $("userList").textContent = "صارفین لوڈ نہیں ہو سکے: " + error.message;
  });
}

function renderUsers() {
  const search = $("searchUsers").value.trim().toLowerCase();
  const filtered = usersCache.filter(user =>
    (user.name || "").toLowerCase().includes(search) ||
    (user.email || "").toLowerCase().includes(search)
  );

  if (!filtered.length) {
    $("userList").innerHTML = '<div class="empty">کوئی صارف نہیں ملا۔</div>';
    return;
  }

  $("userList").innerHTML = filtered.map(user => `
    <div class="user-item ${currentPeer && currentPeer.uid === user.uid ? "active" : ""}"
      data-uid="${safeText(user.uid)}">
      <div class="avatar">${safeText(initials(user.name))}</div>
      <div class="user-info">
        <div class="user-name">${safeText(user.name || "بغیر نام")}</div>
        <div class="user-status ${user.online ? "online" : ""}">
          ${user.online ? "● آن لائن" : "آف لائن"}
        </div>
      </div>
    </div>
  `).join("");

  $("userList").querySelectorAll(".user-item").forEach(item => {
    item.onclick = () => {
      const user = usersCache.find(u => u.uid === item.dataset.uid);
      if (user) openChat(user);
    };
  });
}

$("searchUsers").addEventListener("input", renderUsers);

function makeChatId(uid1, uid2) {
  return [uid1, uid2].sort().join("_");
}

async function openChat(peer) {
  currentPeer = peer;
  currentChatId = makeChatId(currentUser.uid, peer.uid);

  $("chatName").textContent = peer.name || "صارف";
  $("chatAvatar").textContent = initials(peer.name);
  $("chatStatus").textContent = peer.online ? "آن لائن" : "آف لائن";
  $("messageInput").disabled = false;
  $("sendButton").disabled = false;
  $("messages").innerHTML = '<div class="empty">پیغامات لوڈ ہو رہے ہیں...</div>';
  $("main").classList.add("chat-open");
  renderUsers();

  const chatRef = db.collection("chats").doc(currentChatId);

  try {
    const doc = await chatRef.get();
    if (!doc.exists) {
      await chatRef.set({
        members: [currentUser.uid, peer.uid].sort(),
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    }
    listenMessages();
  } catch (error) {
    $("messages").innerHTML =
      '<div class="empty">چیٹ کھولنے میں مسئلہ: ' + safeText(error.message) + '</div>';
  }
}

function listenMessages() {
  if (unsubscribeMessages) unsubscribeMessages();

  unsubscribeMessages = db.collection("chats")
    .doc(currentChatId)
    .collection("messages")
    .orderBy("createdAt", "asc")
    .onSnapshot(snapshot => {
      if (snapshot.empty) {
        $("messages").innerHTML = '<div class="empty">ابھی کوئی پیغام نہیں۔ پہلا پیغام بھیجیں!</div>';
        return;
      }

      $("messages").innerHTML = snapshot.docs.map(doc => {
        const msg = doc.data();
        const mine = msg.senderId === currentUser.uid;
        const time = msg.createdAt && msg.createdAt.toDate
          ? msg.createdAt.toDate().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})
          : "";
        return `
          <div class="bubble ${mine ? "mine" : ""}">
            ${safeText(msg.text)}
            <div class="msg-time">${time}</div>
          </div>`;
      }).join("");

      $("messages").scrollTop = $("messages").scrollHeight;
    }, error => {
      $("messages").textContent = "پیغامات لوڈ کرنے میں مسئلہ: " + error.message;
    });
}

$("messageForm").onsubmit = async event => {
  event.preventDefault();
  const text = $("messageInput").value.trim();
  if (!text || !currentChatId || !currentPeer) return;

  $("sendButton").disabled = true;
  try {
    const chatRef = db.collection("chats").doc(currentChatId);
    await chatRef.collection("messages").add({
      senderId: currentUser.uid,
      text: text,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    await chatRef.update({
      lastMessage: text,
      lastSenderId: currentUser.uid,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    $("messageInput").value = "";
  } catch (error) {
    alert("پیغام نہیں بھیجا جا سکا: " + error.message);
  } finally {
    $("sendButton").disabled = false;
  }
};

$("menuButton").onclick = () => $("menu").classList.toggle("hidden");

document.addEventListener("click", event => {
  if (!event.target.closest(".menu-wrap")) {
    $("menu").classList.add("hidden");
  }
});

$("profileButton").onclick = async () => {
  const oldName = currentUser.displayName || "";
  const newName = prompt("اپنا نیا نام لکھیں:", oldName);
  if (!newName || !newName.trim()) return;

  try {
    await db.collection("users").doc(currentUser.uid).set({
      name: newName.trim()
    }, {merge:true});
    await currentUser.updateProfile({displayName:newName.trim()});
    $("headerUser").textContent = newName.trim();
    alert("آپ کا نام تبدیل ہو گیا ہے۔");
  } catch (error) {
    alert("نام تبدیل نہیں ہوا: " + error.message);
  }
};

$("refreshButton").onclick = () => {
  startUsers();
  $("menu").classList.add("hidden");
};

$("logoutButton").onclick = async () => {
  await setPresence(false);
  await auth.signOut();
};

$("backButton").onclick = () => {
  $("main").classList.remove("chat-open");
};

auth.onAuthStateChanged(async user => {
  if (unsubscribeUsers) unsubscribeUsers();
  if (unsubscribeChats) unsubscribeChats();
  if (unsubscribeMessages) unsubscribeMessages();

  currentUser = user;
  currentPeer = null;
  currentChatId = null;

  if (!user) {
    showAuth();
    $("password").value = "";
    return;
  }

  try {
    const userRef = db.collection("users").doc(user.uid);
    const userDoc = await userRef.get();

    if (!userDoc.exists) {
      await userRef.set({
        uid:user.uid,
        name:user.displayName || user.email.split("@")[0],
        email:user.email,
        online:true,
        lastSeen:firebase.firestore.FieldValue.serverTimestamp()
      });
    }

    await setPresence(true);
    $("headerUser").textContent = user.displayName || user.email;
    showApp();
    startUsers();

  } catch (error) {
    showApp();
    $("userList").textContent = "Firebase مسئلہ: " + error.message;
  }
});

document.addEventListener("visibilitychange", () => {
  if (document.hidden) setPresence(false);
  else setPresence(true);
});

window.addEventListener("beforeunload", () => {
  setPresence(false);
});

updateAuthMode();
</script>
</body>
</html>
