

<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zain Bhatti Chat</title>
<meta name="theme-color" content="#101827">
<link rel="manifest" href="./manifest.json">

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#101827;
  color:white;
  font-family:Arial,sans-serif
}
header{
  background:#172438;
  padding:18px;
  text-align:center;
  color:#00e5a8;
  font-size:22px;
  font-weight:bold
}
.container{max-width:900px;margin:auto;padding:15px}
.panel{
  background:#1e293b;
  padding:18px;
  border-radius:12px;
  margin:12px 0
}
input,button{
  padding:13px;
  border:0;
  border-radius:8px;
  font-size:15px
}
input{
  width:100%;
  margin:6px 0;
  background:#f1f5f9;
  color:#111
}
button{
  background:#00e5a8;
  color:#101827;
  font-weight:bold;
  cursor:pointer;
  margin:4px
}
button:disabled{opacity:.5}
.hidden{display:none!important}
#app{
  display:grid;
  grid-template-columns:260px 1fr;
  gap:12px
}
#users{max-height:60vh;overflow:auto}
.user{
  padding:12px;
  background:#29374c;
  border-radius:8px;
  margin:6px 0;
  cursor:pointer
}
.user:hover{background:#354761}
#messages{
  height:48vh;
  overflow:auto;
  background:#111c2d;
  padding:12px;
  border-radius:8px
}
.msg{
  background:#29374c;
  padding:10px;
  border-radius:10px;
  margin:8px 0;
  max-width:85%;
  overflow-wrap:anywhere
}
.mine{
  background:#075e50;
  margin-left:auto
}
#composer{
  display:flex;
  gap:5px;
  margin-top:8px
}
#composer input{flex:1;min-width:0}
small{color:#cbd5e1}
#status,#authMessage{overflow-wrap:anywhere}
#authMessage{color:#ffb4b4}
#status{color:#00e5a8}
@media(max-width:650px){
  #app{grid-template-columns:1fr}
  #users{max-height:180px}
  #messages{height:42vh}
}
</style>
</head>

<body>

<header>💬 Zain Bhatti Chat</header>

<div class="container">

<section id="authBox" class="panel">

<h2 id="authTitle">اپنا اکاؤنٹ بنائیں</h2>

<input id="name" placeholder="آپ کا نام">

<input id="email" type="email" placeholder="ای میل">

<input id="password" type="password" placeholder="پاس ورڈ">

<button id="authButton">اکاؤنٹ بنائیں</button>

<button id="switchAuth">
پہلے سے اکاؤنٹ ہے؟ لاگ اِن کریں
</button>

<p id="authMessage"></p>

</section>

<section id="mainBox" class="hidden">

<div class="panel">
آپ لاگ اِن ہیں:
<b id="myName"></b>
<button id="logoutButton">لاگ آؤٹ</button>
</div>

<div id="app">

<div class="panel">

<h3>صارفین تلاش کریں</h3>

<input id="search" placeholder="نام یا ای میل تلاش کریں">

<div id="users">صارفین لوڈ ہو رہے ہیں...</div>

</div>

<div class="panel">

<h3 id="chatTitle">
چیٹ کھولنے کے لیے صارف منتخب کریں
</h3>

<div id="messages">
</div>

<div id="composer">

<input id="messageInput" placeholder="اپنا پیغام لکھیں">

<button id="sendButton">بھیجیں</button>

</div>

<p id="status"></p>

</div>

</div>
</section>
</div>

<!-- Firebase SDK -->

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<script>

// Firebase Web App Configuration

const firebaseConfig = {
  apiKey: "AIzaSyBBM8njxaNWZcZib0HA3kPNmw32CMc0tqs",
  authDomain: "zain-bhatti-chat.firebaseapp.com",
  projectId: "zain-bhatti-chat",
  storageBucket: "zain-bhatti-chat.firebasestorage.app",
  messagingSenderId: "815632070562",
  appId: "1:815632070562:web:d28b401630fd4cf21064fb"
};

// Initialize Firebase

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

// App variables

let currentUser = null;
let selectedUser = null;
let unsubscribeMessages = null;
let unsubscribeUsers = null;
let allUsers = [];
let registerMode = true;

const $ = id => document.getElementById(id);

// Status

function showStatus(message) {
  $("status").textContent = message;
}

// Chat ID

function chatId(uid1, uid2) {
  return [uid1, uid2].sort().join("_");
}

// Switch Login / Signup

$("switchAuth").onclick = () => {

  registerMode = !registerMode;

  $("authTitle").textContent = registerMode
    ? "اپنا اکاؤنٹ بنائیں"
    : "اپنے اکاؤنٹ میں لاگ اِن کریں";

  $("authButton").textContent = registerMode
    ? "اکاؤنٹ بنائیں"
    : "لاگ اِن کریں";

  $("switchAuth").textContent = registerMode
    ? "پہلے سے اکاؤنٹ ہے؟ لاگ اِن کریں"
    : "نیا اکاؤنٹ بنائیں";

  $("name").classList.toggle("hidden", !registerMode);

  $("authMessage").textContent = "";
};

// Signup and Login

$("authButton").onclick = async () => {

  const email = $("email").value.trim().toLowerCase();
  const password = $("password").value;
  const name = $("name").value.trim();

  if (!email || !password || (registerMode && !name)) {
    $("authMessage").textContent =
      "تمام ضروری خانے پُر کریں۔";
    return;
  }

  if (password.length < 6) {
    $("authMessage").textContent =
      "پاس ورڈ کم از کم 6 حروف کا ہونا چاہیے۔";
    return;
  }

  $("authButton").disabled = true;
  $("authMessage").textContent = "براہ کرم انتظار کریں...";

  try {

    if (registerMode) {

      const result =
        await auth.createUserWithEmailAndPassword(
          email,
          password
        );

      await result.user.updateProfile({
        displayName: name
      });

      await db.collection("users")
        .doc(result.user.uid)
        .set({
          uid: result.user.uid,
          name: name,
          email: email,
          createdAt:
            firebase.firestore.FieldValue.serverTimestamp(),
          lastSeen:
            firebase.firestore.FieldValue.serverTimestamp()
        });

    } else {

      await auth.signInWithEmailAndPassword(
        email,
        password
      );

    }

    $("authMessage").textContent = "";

  } catch(error) {

    $("authMessage").textContent =
      "مسئلہ: " + error.message;

  }

  $("authButton").disabled = false;
};

// Authentication State

auth.onAuthStateChanged(async user => {

  if (!user) {

    currentUser = null;
    selectedUser = null;

    if (unsubscribeUsers) {
      unsubscribeUsers();
      unsubscribeUsers = null;
    }

    if (unsubscribeMessages) {
      unsubscribeMessages();
      unsubscribeMessages = null;
    }

    $("authBox").classList.remove("hidden");
    $("mainBox").classList.add("hidden");

    return;
  }

  currentUser = user;

  $("authBox").classList.add("hidden");
  $("mainBox").classList.remove("hidden");

  try {

    const userRef = db.collection("users").doc(user.uid);

    const userDoc = await userRef.get();

    if (!userDoc.exists) {

      await userRef.set({
        uid: user.uid,
        name: user.displayName || user.email,
        email: (user.email || "").toLowerCase(),
        createdAt:
          firebase.firestore.FieldValue.serverTimestamp()
      });

    }

    const profile = await userRef.get();

    $("myName").textContent =
      profile.data().name || user.email;

    await userRef.set({
      lastSeen:
        firebase.firestore.FieldValue.serverTimestamp()
    }, {merge:true});

    loadUsers();

  } catch(error) {

    showStatus("اکاؤنٹ کی خرابی: " + error.message);

  }

});

// Logout

$("logoutButton").onclick = async () => {

  try {
    await auth.signOut();
  } catch(error) {
    showStatus("Logout مسئلہ: " + error.message);
  }

};

// Load Users

function loadUsers() {

  if (unsubscribeUsers) unsubscribeUsers();

  unsubscribeUsers = db.collection("users").onSnapshot(

    snapshot => {

      allUsers = snapshot.docs
        .map(doc => doc.data())
        .filter(u => u.uid !== currentUser.uid);

      showUsers();

    },

    error => {

      showStatus(
        "صارفین لوڈ نہیں ہوئے: " + error.message
      );

    }

  );

}

// Display Users

function showUsers() {

  if (!currentUser) return;

  const search =
    $("search").value.toLowerCase();

  $("users").innerHTML = "";

  const filtered = allUsers.filter(u =>

    (u.name || "").toLowerCase().includes(search) ||

    (u.email || "").toLowerCase().includes(search)

  );

  if (!filtered.length) {

    $("users").textContent =
      "کوئی دوسرا صارف نہیں ملا۔";

    return;

  }

  filtered.forEach(u => {

    const div = document.createElement("div");

    div.className = "user";

    const name = document.createElement("b");

    name.textContent = u.name || "بغیر نام";

    const email = document.createElement("small");

    email.textContent = u.email || "";

    email.style.display = "block";

    div.append(name, email);

    div.onclick = () => openChat(u);

    $("users").appendChild(div);

  });

}

$("search").addEventListener("input", showUsers);

// Open Chat

function openChat(user) {

  selectedUser = user;

  $("chatTitle").textContent =
    user.name || user.email;

  $("messages").innerHTML = "";

  showStatus("");

  if (unsubscribeMessages) {
    unsubscribeMessages();
    unsubscribeMessages = null;
  }

  const id = chatId(
    currentUser.uid,
    user.uid
  );

  unsubscribeMessages = db.collection("chats")
    .doc(id)
    .collection("messages")
    .orderBy("createdAt")
    .onSnapshot(

      snapshot => {

        $("messages").innerHTML = "";

        snapshot.forEach(doc => {

          const m = doc.data();

          const div = document.createElement("div");

          div.className = "msg" +
            (m.senderId === currentUser.uid
              ? " mine"
              : "");

          div.textContent = m.text || "";

          $("messages").appendChild(div);

        });

        $("messages").scrollTop =
          $("messages").scrollHeight;

      },

      error => {

        showStatus(
          "چیٹ کی خرابی: " + error.message
        );

      }

    );

}

// Send Message

async function sendMessage(text) {

  if (!currentUser) return;

  if (!selectedUser) {

    showStatus(
      "پہلے کسی صارف کو منتخب کریں۔"
    );

    return;

  }

  text = text.trim();

  if (!text) return;

  const id = chatId(
    currentUser.uid,
    selectedUser.uid
  );

  const chatRef =
    db.collection("chats").doc(id);

  $("sendButton").disabled = true;

  try {

    await chatRef.set({

      members: [
        currentUser.uid,
        selectedUser.uid
      ],

      updatedAt:
        firebase.firestore.FieldValue.serverTimestamp()

    }, {merge:true});

    await chatRef.collection("messages").add({

      text: text,

      type: "text",

      senderId: currentUser.uid,

      receiverId: selectedUser.uid,

      createdAt:
        firebase.firestore.FieldValue.serverTimestamp()

    });

    await chatRef.set({

      lastMessage: text,

      updatedAt:
        firebase.firestore.FieldValue.serverTimestamp()

    }, {merge:true});

    $("messageInput").value = "";

    showStatus("");

  } catch(error) {

    showStatus(
      "پیغام نہیں بھیجا گیا: " + error.message
    );

  }

  $("sendButton").disabled = false;

}

// Send Button

$("sendButton").onclick = () => {

  sendMessage($("messageInput").value);

};

// Enter to Send

$("messageInput").addEventListener(
  "keydown",
  e => {

    if (e.key === "Enter") {

      sendMessage($("messageInput").value);

    }

  }
);

// Service Worker

if ("serviceWorker" in navigator) {

  window.addEventListener("load", () => {

    navigator.serviceWorker.register(
      "./service-worker.js"
    ).catch(error => {
      console.log("Service Worker:", error);
    });

  });

}

</script>

</body>
</html>
