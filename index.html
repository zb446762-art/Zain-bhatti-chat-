<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101010">
<title>Zain Bhatti Chat</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101010;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:520px;margin:auto;min-height:100vh;background:#171717}.head{padding:17px;background:#202020;color:#f5c542;font-size:21px;font-weight:bold;position:sticky;top:0}.screen{padding:15px}.hide{display:none!important}input,button{font:inherit}input{width:100%;padding:14px;margin:7px 0;border:1px solid #555;border-radius:10px;background:#252525;color:white}button{border:0;border-radius:10px;padding:13px;background:#f5c542;color:#171717;font-weight:bold;cursor:pointer}.wide{width:100%;margin-top:8px}.link{background:none;color:#f5c542;padding:12px}.row{display:flex;align-items:center;gap:12px;padding:13px 5px;border-bottom:1px solid #333;cursor:pointer}.avatar{width:45px;height:45px;border-radius:50%;background:#5b4715;display:grid;place-items:center;color:#fff;font-weight:bold;flex-shrink:0}.grow{flex:1;min-width:0}.muted{color:#aaa;font-size:13px;margin-top:5px;overflow-wrap:anywhere}.search{margin:5px 0 12px}.chathead{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #444}.back{background:#333;color:white}.messages{height:calc(100dvh - 225px);min-height:280px;overflow:auto;padding:12px 0}.bubble{max-width:82%;padding:11px 13px;margin:7px 0;border-radius:14px;overflow-wrap:anywhere}.mine{margin-left:auto;background:#f5c542;color:#171717}.theirs{background:#333}.time{font-size:10px;opacity:.7;text-align:right;margin-top:5px}.compose{display:flex;gap:7px;align-items:center}.compose input{flex:1;min-width:0}.empty{text-align:center;color:#aaa;padding:35px 10px}.error{color:#ff7777;white-space:pre-wrap;font-size:13px}.tabs{display:flex;gap:8px}.tabs button{flex:1;background:#333;color:white}.tabs button.on{background:#f5c542;color:#111}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">♛ Zain Bhatti Chat</div>
  <section id="auth" class="screen">
    <h2 id="authTitle">Login</h2>
    <div id="signupNameBox" class="hide"><input id="name" placeholder="Your name"></div>
    <input id="email" type="email" autocomplete="email" placeholder="Email address">
    <input id="password" type="password" autocomplete="current-password" placeholder="Password (at least 6 characters)">
    <button class="wide" id="authButton" onclick="submitAuth()">Login</button>
    <button class="link wide" id="switchButton" onclick="switchAuth()">Create new account</button>
    <div id="authError" class="error"></div>
  </section>

  <section id="home" class="screen hide">
    <input id="search" class="search" placeholder="Search people by name or email" oninput="searchUsers()">
    <div class="tabs"><button id="peopleTab" class="on" onclick="showPeople()">People</button><button id="chatsTab" onclick="showChats()">Chats</button></div>
    <div id="results"></div>
    <button class="link wide" onclick="logout()">Log out</button>
  </section>

  <section id="conversation" class="screen hide">
    <div class="chathead">
      <button class="back" onclick="backHome()">‹</button>
      <div class="avatar" id="peerAvatar">?</div>
      <div class="grow"><b id="peerName">Chat</b><div class="muted" id="peerEmail"></div></div>
    </div>
    <div id="messages" class="messages"></div>
    <div class="compose">
      <input id="message" placeholder="Type a message..." onkeydown="if(event.key==='Enter')sendMessage()">
      <button onclick="sendMessage()">Send</button>
    </div>
    <div id="chatError" class="error"></div>
  </section>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
'use strict';

/* Your Firebase project configuration */
const firebaseConfig = {
  apiKey: "AIzaSyBBM8njxaNWZcZib0HA3kPNmw32CMc0tqs",
  authDomain: "zain-bhatti-chat.firebaseapp.com",
  projectId: "zain-bhatti-chat",
  storageBucket: "zain-bhatti-chat.firebasestorage.app",
  messagingSenderId: "815632070562",
  appId: "1:815632070562:web:4a9b1ce52f77650d1064fb"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const $ = id => document.getElementById(id);

let currentUser = null;
let myProfile = {};
let authMode = 'login';
let activePeer = null;
let activeChatId = null;
let peopleCache = [];
let messageUnsubscribe = null;
let chatUnsubscribe = null;
let pageMode = 'people';

function escapeHTML(value) {
  return String(value == null ? '' : value).replace(/[&<>"']/g, ch => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  })[ch]);
}
function showError(id, error) {
  $(id).textContent = error && error.message ? error.message : String(error);
}
function switchAuth() {
  authMode = authMode === 'login' ? 'signup' : 'login';
  $('authTitle').textContent = authMode === 'login' ? 'Login' : 'Create account';
  $('authButton').textContent = authMode === 'login' ? 'Login' : 'Sign up';
  $('switchButton').textContent = authMode === 'login' ? 'Create new account' : 'Already have an account? Login';
  $('signupNameBox').classList.toggle('hide', authMode === 'login');
  $('authError').textContent = '';
}
async function submitAuth() {
  $('authError').textContent = '';
  const email = $('email').value.trim().toLowerCase();
  const password = $('password').value;
  try {
    if (!email || !password) throw new Error('Email اور password درج کریں۔');
    if (authMode === 'signup') {
      const name = $('name').value.trim();
      if (!name) throw new Error('اپنا نام درج کریں۔');
      if (password.length < 6) throw new Error('Password کم از کم 6 حروف کا ہونا چاہیے۔');
      const credential = await auth.createUserWithEmailAndPassword(email, password);
      await credential.user.updateProfile({displayName:name});
      await db.collection('users').doc(credential.user.uid).set({
        uid:credential.user.uid, name:name, email:email, photoURL:'',
        createdAt:firebase.firestore.FieldValue.serverTimestamp()
      }, {merge:true});
    } else {
      await auth.signInWithEmailAndPassword(email, password);
    }
  } catch (error) { showError('authError', error); }
}
function showScreen(name) {
  ['auth','home','conversation'].forEach(id => $(id).classList.toggle('hide', id !== name));
}
auth.onAuthStateChanged(async user => {
  if (!user) {
    currentUser = null;
    if (chatUnsubscribe) chatUnsubscribe();
    if (messageUnsubscribe) messageUnsubscribe();
    showScreen('auth');
    return;
  }
  currentUser = user;
  try {
    await ensureMyProfile();
    showScreen('home');
    await loadPeople();
    showPeople();
  } catch (error) {
    showScreen('home');
    $('results').innerHTML = '<div class="error">Profile/database error: '+escapeHTML(error.message)+'</div>';
  }
});
async function ensureMyProfile() {
  const ref = db.collection('users').doc(currentUser.uid);
  const snap = await ref.get();
  if (!snap.exists) {
    await ref.set({
      uid:currentUser.uid,
      name:currentUser.displayName || (currentUser.email || 'User').split('@')[0],
      email:currentUser.email || '',
      photoURL:'',
      createdAt:firebase.firestore.FieldValue.serverTimestamp()
    });
  }
  const fresh = await ref.get();
  myProfile = fresh.data() || {};
  if (!myProfile.uid) {
    await ref.set({uid:currentUser.uid,email:currentUser.email || ''},{merge:true});
    myProfile.uid = currentUser.uid;
  }
}
async function loadPeople() {
  $('results').innerHTML = '<div class="empty">Loading users...</div>';
  try {
    const snap = await db.collection('users').limit(300).get();
    peopleCache = snap.docs.map(doc => {
      const data = doc.data() || {};
      return {...data, uid:data.uid || doc.id};
    }).filter(person => person.uid && person.uid !== currentUser.uid);
    renderPeople(peopleCache);
  } catch (error) {
    $('results').innerHTML = '<div class="error">Users could not load: '+escapeHTML(error.message)+'</div>';
  }
}
function renderPeople(list) {
  if (!list.length) {
    $('results').innerHTML = '<div class="empty">ابھی کوئی دوسرا رجسٹرڈ صارف نہیں ملا۔ دوسرے اکاؤنٹ سے بھی رجسٹر ہو کر دیکھیں۔</div>';
    return;
  }
  $('results').innerHTML = list.map(person => {
    const name = person.name || person.displayName || 'User';
    const email = person.email || '';
    const uid = escapeHTML(person.uid);
    return `<div class="row" onclick="startChat('${uid}')">
      <div class="avatar">${escapeHTML(name.charAt(0).toUpperCase())}</div>
      <div class="grow"><b>${escapeHTML(name)}</b><div class="muted">${escapeHTML(email)}</div></div>
      <b style="color:#f5c542">Chat ›</b>
    </div>`;
  }).join('');
}
async function searchUsers() {
  const q = $('search').value.trim().toLowerCase();
  if (pageMode !== 'people') return;
  if (!q) { renderPeople(peopleCache); return; }
  const filtered = peopleCache.filter(person =>
    String(person.name || person.displayName || '').toLowerCase().includes(q) ||
    String(person.email || '').toLowerCase().includes(q)
  );
  renderPeople(filtered);
}
function showPeople() {
  pageMode = 'people';
  $('peopleTab').classList.add('on');
  $('chatsTab').classList.remove('on');
  $('search').classList.remove('hide');
  $('search').value = '';
  renderPeople(peopleCache);
}
function showChats() {
  pageMode = 'chats';
  $('peopleTab').classList.remove('on');
  $('chatsTab').classList.add('on');
  $('search').classList.add('hide');
  loadChats();
}
async function loadChats() {
  if (!currentUser) return;
  if (chatUnsubscribe) chatUnsubscribe();
  $('results').innerHTML = '<div class="empty">Loading chats...</div>';
  chatUnsubscribe = db.collection('chats')
    .where('members','array-contains',currentUser.uid)
    .onSnapshot(async snapshot => {
      const rows = [];
      for (const doc of snapshot.docs) {
        const chat = doc.data() || {};
        const otherUid = (chat.members || []).find(uid => uid !== currentUser.uid);
        if (!otherUid) continue;
        const person = peopleCache.find(p => p.uid === otherUid) || {uid:otherUid,name:'User'};
        rows.push(`<div class="row" onclick="startChat('${escapeHTML(otherUid)}')">
          <div class="avatar">${escapeHTML((person.name || 'U').charAt(0).toUpperCase())}</div>
          <div class="grow"><b>${escapeHTML(person.name || 'User')}</b><div class="muted">${escapeHTML(chat.lastMessage || 'Open conversation')}</div></div>
        </div>`);
      }
      $('results').innerHTML = rows.join('') || '<div class="empty">ابھی کوئی چیٹ نہیں۔ People میں جا کر کسی صارف کو منتخب کریں۔</div>';
    }, error => showError('results', error));
}
async function startChat(uid) {
  if (!uid || uid === currentUser.uid) return;
  $('chatError').textContent = '';
  try {
    const personSnap = await db.collection('users').doc(uid).get();
    if (!personSnap.exists) throw new Error('یہ صارف users collection میں موجود نہیں۔');
    activePeer = {...personSnap.data(), uid};
    const members = [currentUser.uid, uid].sort();
    const chatId = members.join('_');
    const chatRef = db.collection('chats').doc(chatId);
    const chatSnap = await chatRef.get();
    if (!chatSnap.exists) {
      await chatRef.set({
        type:'private',
        members:members,
        createdAt:firebase.firestore.FieldValue.serverTimestamp(),
        updatedAt:firebase.firestore.FieldValue.serverTimestamp(),
        lastMessage:''
      });
    }
    activeChatId = chatId;
    $('peerName').textContent = activePeer.name || activePeer.displayName || 'User';
    $('peerEmail').textContent = activePeer.email || '';
    $('peerAvatar').textContent = (activePeer.name || 'U').charAt(0).toUpperCase();
    $('message').value = '';
    $('chatError').textContent = '';
    showScreen('conversation');
    listenMessages();
  } catch (error) {
    alert('Chat نہیں کھل سکی: ' + error.message);
  }
}
function listenMessages() {
  if (messageUnsubscribe) messageUnsubscribe();
  const box = $('messages');
  box.innerHTML = '<div class="empty">Loading messages...</div>';
  messageUnsubscribe = db.collection('chats').doc(activeChatId).collection('messages')
    .orderBy('createdAt','asc')
    .onSnapshot(snapshot => {
      if (snapshot.empty) {
        box.innerHTML = '<div class="empty">یہاں سے گفتگو شروع کریں۔</div>';
        return;
      }
      box.innerHTML = snapshot.docs.map(doc => {
        const msg = doc.data() || {};
        const mine = msg.senderId === currentUser.uid;
        const stamp = msg.createdAt && msg.createdAt.toDate
          ? msg.createdAt.toDate().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : '';
        return `<div class="bubble ${mine?'mine':'theirs'}">${escapeHTML(msg.text || '')}<div class="time">${stamp}</div></div>`;
      }).join('');
      box.scrollTop = box.scrollHeight;
    }, error => showError('chatError', error));
}
async function sendMessage() {
  const text = $('message').value.trim();
  if (!text || !activeChatId) return;
  $('chatError').textContent = '';
  $('message').value = '';
  try {
    const chatRef = db.collection('chats').doc(activeChatId);
    await chatRef.collection('messages').add({
      text:text,
      senderId:currentUser.uid,
      createdAt:firebase.firestore.FieldValue.serverTimestamp()
    });
    await chatRef.set({
      lastMessage:text,
      updatedAt:firebase.firestore.FieldValue.serverTimestamp()
    }, {merge:true});
  } catch (error) {
    $('message').value = text;
    showError('chatError', error);
  }
}
function backHome() {
  if (messageUnsubscribe) { messageUnsubscribe(); messageUnsubscribe = null; }
  activeChatId = null;
  activePeer = null;
  showScreen('home');
  showChats();
}
async function logout() {
  if (chatUnsubscribe) { chatUnsubscribe(); chatUnsubscribe = null; }
  if (messageUnsubscribe) { messageUnsubscribe(); messageUnsubscribe = null; }
  await auth.signOut();
}
</script>
</body>
</html>
